name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: main
  NAMESPACE: services-ms
  IMAGE: ghcr.io/edunsantos/tech-challenge-services-ms

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  build:
    name: Build and push image
    needs: [test, terraform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: services-ms-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply namespace
        run: kubectl apply -f k8s/00-namespace/

      # Os arquivos k8s/01-config só têm placeholders: config e segredos vêm das variáveis/secrets do repositório.
      - name: Apply config and secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          SQS_SERVICE_ORDERS_CREATED_URL: ${{ secrets.SQS_SERVICE_ORDERS_CREATED_URL }}
          SQS_SERVICE_ORDER_STATUS_CHANGED_URL: ${{ secrets.SQS_SERVICE_ORDER_STATUS_CHANGED_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          # Parte do ConfigMap versionado, sobrescrevendo só os valores específicos do ambiente.
          sed -e "s|<RDS_ENDPOINT>|${DB_HOST}|" \
              -e "s|<sqs_service_orders_created_url>|${SQS_SERVICE_ORDERS_CREATED_URL}|" \
              -e "s|<sqs_service_order_status_changed_url>|${SQS_SERVICE_ORDER_STATUS_CHANGED_URL}|" \
              k8s/01-config/configmap.yaml | kubectl apply -f -

          kubectl create secret generic services-ms-secret \
            --namespace "$NAMESPACE" \
            --from-literal=APP_KEY="$APP_KEY" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            --from-literal=AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-secret \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run migrations
        run: |
          kubectl delete job services-ms-migrate -n "$NAMESPACE" --ignore-not-found
          sed "s|${IMAGE}:latest|${IMAGE}:${GITHUB_SHA}|" k8s/02-app/migrate-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/services-ms-migrate -n "$NAMESPACE" --timeout=300s \
            || { kubectl logs job/services-ms-migrate -n "$NAMESPACE" --tail=100; exit 1; }

      - name: Deploy application
        run: |
          for f in web-deployment workers-deployment web-service-hpa; do
            sed "s|${IMAGE}:latest|${IMAGE}:${GITHUB_SHA}|" "k8s/02-app/${f}.yaml" | kubectl apply -f -
          done
          for d in services-ms-web services-ms-consumer services-ms-outbox; do
            kubectl rollout status "deployment/${d}" -n "$NAMESPACE" --timeout=300s
          done
