
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: main
  NAMESPACE: services-ms
  IMAGE: ghcr.io/edunsantos/tech-challenge-services-ms

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Validate infrastructure configuration
        working-directory: infra
        run: |
          terraform fmt -check *.tf
          terraform init -backend=false -input=false
          terraform validate

  terraform_apply:
    name: Terraform Plan and Apply
    needs: [test, terraform]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: services-ms-terraform
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false -reconfigure

      - name: Terraform Plan
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: terraform apply -input=false -auto-approve tfplan

  build:
    name: Build and push image
    needs: [test, terraform, terraform_apply]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        env:
          IMAGE: ${{ env.IMAGE }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${SHA}"
            if [ "$REF" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: [build, terraform_apply]
    runs-on: ubuntu-latest

    concurrency:
      group: services-ms-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply namespace
        run: kubectl apply -f k8s/00-namespace/

      # Os arquivos k8s/01-config só têm placeholders:
      # config e segredos vêm das variáveis/secrets do repositório.
      - name: Apply config and secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          SQS_SERVICE_ORDERS_CREATED_URL: ${{ secrets.SQS_SERVICE_ORDERS_CREATED_URL }}
          SQS_SERVICE_ORDER_STATUS_CHANGED_URL: ${{ secrets.SQS_SERVICE_ORDER_STATUS_CHANGED_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          sed -e "s|<RDS_ENDPOINT>|${DB_HOST}|" \
              -e "s|<sqs_service_orders_created_url>|${SQS_SERVICE_ORDERS_CREATED_URL}|" \
              -e "s|<sqs_service_order_status_changed_url>|${SQS_SERVICE_ORDER_STATUS_CHANGED_URL}|" \
              k8s/01-config/configmap.yaml | kubectl apply -f -

          kubectl create secret generic services-ms-secret \
            --namespace "$NAMESPACE" \
            --from-literal=APP_KEY="$APP_KEY" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-secret \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run migrations
        run: |
          set -euo pipefail

          diagnose_migration() {
            echo "=== Estado do Job de migracao ==="
            kubectl get job services-ms-migrate -n "$NAMESPACE" \
              -o 'custom-columns=NAME:.metadata.name,ACTIVE:.status.active,SUCCEEDED:.status.succeeded,FAILED:.status.failed,CONDITIONS:.status.conditions[*].type,REASONS:.status.conditions[*].reason' || true
            echo "=== Eventos do Job (motivos, sem mensagens) ==="
            kubectl get events -n "$NAMESPACE" \
              --field-selector 'involvedObject.kind=Job,involvedObject.name=services-ms-migrate' \
              --sort-by=.lastTimestamp \
              -o 'custom-columns=TYPE:.type,REASON:.reason,COUNT:.count' || true
            echo "=== Pods e estado dos containers ==="
            kubectl get pods -n "$NAMESPACE" -l job-name=services-ms-migrate \
              -o 'custom-columns=NAME:.metadata.name,PHASE:.status.phase,WAITING:.status.containerStatuses[*].state.waiting.reason,TERMINATED:.status.containerStatuses[*].state.terminated.reason,EXIT_CODE:.status.containerStatuses[*].state.terminated.exitCode,LAST_TERMINATED:.status.containerStatuses[*].lastState.terminated.reason,LAST_EXIT_CODE:.status.containerStatuses[*].lastState.terminated.exitCode,RESTARTS:.status.containerStatuses[*].restartCount' || true

            if ! pods=$(kubectl get pods -n "$NAMESPACE" -l job-name=services-ms-migrate -o jsonpath='{.items[*].metadata.name}'); then
              echo "Nao foi possivel listar os pods do Job."
              return
            fi
            if [ -z "$pods" ]; then
              echo "Nenhum pod encontrado para o Job."
              return
            fi

            for pod in $pods; do
              echo "=== Eventos do pod $pod (motivos, sem mensagens) ==="
              kubectl get events -n "$NAMESPACE" \
                --field-selector "involvedObject.kind=Pod,involvedObject.name=$pod" \
                --sort-by=.lastTimestamp \
                -o 'custom-columns=TYPE:.type,REASON:.reason,COUNT:.count' || true

              for attempt in current previous; do
                echo "=== Diagnostico dos logs $attempt do pod $pod ==="
                args=()
                if [ "$attempt" = previous ]; then args+=(--previous); fi
                if ! kubectl logs "$pod" -n "$NAMESPACE" -c migrate --tail=200 "${args[@]}" 2>/dev/null |
                  python3 -c '
          import re
          import sys

          log = sys.stdin.read()
          checks = [
              ("Autenticacao recusada pelo banco", r"access denied|password authentication failed|authentication failed|\b1045\b"),
              ("Banco de dados inexistente", r"unknown database|database .{0,80} does not exist|\b1049\b"),
              ("Falha de resolucao do host", r"getaddrinfo|name or service not known|temporary failure in name resolution|could not translate host name|nodename nor servname"),
              ("Conexao recusada", r"connection refused|\b2003\b"),
              ("Timeout ou rede inacessivel", r"timed? out|timeout|network is unreachable|no route to host"),
              ("Falha TLS ou certificado", r"ssl connection error|tls.*(?:error|failed)|certificate verify failed"),
              ("Driver do banco indisponivel", r"could not find driver"),
          ]
          states = sorted(set(re.findall(r"SQLSTATE\[([A-Za-z0-9]{5})\]", log, re.I)))
          codes = sorted(set(re.findall(r"\[(1045|1049|2002|2003)\]", log)))
          if states:
              print("SQLSTATE:", ", ".join(states))
          if codes:
              print("Codigos do banco:", ", ".join(codes))
          found = False
          for label, pattern in checks:
              if re.search(pattern, log, re.I):
                  print(label)
                  found = True
          if not log:
              print("Log vazio.")
          elif not found and not states and not codes:
              print("Nenhum padrao conhecido; consulte os logs completos por canal seguro.")
          '; then
                  echo "Logs $attempt indisponiveis para o pod $pod."
                fi
              done
            done
          }

          kubectl delete job services-ms-migrate -n "$NAMESPACE" --ignore-not-found
          sed "s|${IMAGE}:latest|${IMAGE}:${GITHUB_SHA}|" k8s/02-app/migrate-job.yaml | kubectl apply -f -

          if ! kubectl wait --for=condition=complete job/services-ms-migrate \
            -n "$NAMESPACE" --timeout=300s; then
            echo "Migracao nao concluiu; coletando diagnostico sem valores de Secrets."
            diagnose_migration
            exit 1
          fi

      - name: Deploy application
        run: |
          for f in web-deployment workers-deployment web-service-hpa; do
            sed "s|${IMAGE}:latest|${IMAGE}:${GITHUB_SHA}|" "k8s/02-app/${f}.yaml" | kubectl apply -f -
          done

          for d in services-ms-web services-ms-consumer services-ms-outbox; do
            kubectl rollout status "deployment/${d}" -n "$NAMESPACE" --timeout=300s
          done
