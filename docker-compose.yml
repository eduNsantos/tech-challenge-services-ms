services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-8-4
    working_dir: /var/www
    ports:
      - "8000:8000"
    env_file: ./.env
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    command: "php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICES_MS_DB_PASSWORD:?Configure SERVICES_MS_DB_PASSWORD no arquivo .env}
      MYSQL_DATABASE: services_ms
      MYSQL_USER: services_ms
      MYSQL_PASSWORD: ${SERVICES_MS_DB_PASSWORD:?Configure SERVICES_MS_DB_PASSWORD no arquivo .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "8083:8080"
    environment:
      SWAGGER_JSON: /app/openapi.yaml
    volumes:
      - ./openapi.yaml:/app/openapi.yaml:ro

  # localstack:
  #   image: localstack/localstack:3
  #   container_name: services-ms-localstack
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     SERVICES: sqs
  #   volumes:
  #     - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh

volumes:
  mysql_data:
