apiVersion: v1
kind: ConfigMap
metadata:
  name: services-ms-config
  namespace: services-ms
data:
  APP_NAME: "Services MS"
  APP_ENV: "production"
  APP_DEBUG: "false"
  LOG_CHANNEL: "stderr"
  DB_CONNECTION: "mysql"
  # Substituído pelo workflow de deploy.
  DB_HOST: "<RDS_ENDPOINT>"
  DB_PORT: "3306"
  DB_DATABASE: "services_ms"
  QUEUE_CONNECTION: "sync"
  CACHE_STORE: "array"
  SESSION_DRIVER: "array"
  # Consumers e publisher SQS rodam em Lambda (infra/lambda.tf); a API não acessa filas.
