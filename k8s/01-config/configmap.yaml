apiVersion: v1
kind: ConfigMap
metadata:
  name: services-ms-config
  namespace: services-ms
data:
  APP_NAME: "Services MS"
  APP_ENV: "production"
  APP_DEBUG: "false"
  LOG_CHANNEL: "stderr"
  DB_CONNECTION: "mysql"
  # Preencher com `terraform output rds_endpoint` (infra/)
  DB_HOST: "<RDS_ENDPOINT>"
  DB_PORT: "3306"
  DB_DATABASE: "services_ms"
  QUEUE_CONNECTION: "sync"
  CACHE_STORE: "array"
  SESSION_DRIVER: "array"
  AWS_DEFAULT_REGION: "us-east-1"
  # Preencher com `terraform output` (infra/)
  SQS_SERVICE_ORDERS_CREATED_URL: "<sqs_service_orders_created_url>"
  SQS_SERVICE_ORDER_STATUS_CHANGED_URL: "<sqs_service_order_status_changed_url>"
