apiVersion: v1
kind: Secret
metadata:
  name: services-ms-secret
  namespace: services-ms
type: Opaque
# Placeholders: preencha antes do apply e NÃO commite os valores reais.
# AWS_SESSION_TOKEN é necessário no AWS Academy/Learner Lab (credenciais temporárias).
stringData:
  APP_KEY: "<php artisan key:generate --show>"
  DB_USERNAME: "<DB_USERNAME>"
  DB_PASSWORD: "<DB_PASSWORD>"
  JWT_SECRET: "<mesmo JWT_SECRET do monólito e da Lambda auth-login>"
  AWS_ACCESS_KEY_ID: "<AWS_ACCESS_KEY_ID>"
  AWS_SECRET_ACCESS_KEY: "<AWS_SECRET_ACCESS_KEY>"
  AWS_SESSION_TOKEN: "<AWS_SESSION_TOKEN>"
