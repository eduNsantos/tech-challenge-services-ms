apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: services-ms
type: kubernetes.io/dockerconfigjson
# Placeholder: prefira `kubectl create secret docker-registry ghcr-secret -n services-ms ...`
stringData:
  .dockerconfigjson: >-
    {
      "auths": {
        "ghcr.io": {
          "username": "<GHCR_USERNAME>",
          "password": "<GHCR_PAT>",
          "auth": "<BASE64_USERNAME:PAT>"
        }
      }
    }
