# OpenTelemetry Collector do Services MS (API web no EKS).
#
# O pod web exporta métricas OTLP/HTTP para este collector, que repassa ao New
# Relic. A license key vem do Secret otel-collector-secret, criado pelo workflow
# de deploy a partir do secret NEW_RELIC_LICENSE_KEY do repositório.
# As Lambdas não alcançam o cluster: usam a layer do collector (infra/lambda.tf).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: services-ms
  labels:
    app: otel-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
      batch:
        send_batch_size: 1024
        timeout: 10s

    exporters:
      otlphttp/newrelic:
        endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
        compression: gzip

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/newrelic]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: services-ms
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # Substituído pelo workflow: reinicia o collector quando a config ou a key mudam.
        checksum/config: "<CONFIG_CHECKSUM>"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          args: ["--config=/etc/otelcol/collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          env:
            - name: K8S_CLUSTER_NAME
              value: "<EKS_CLUSTER_NAME>"
            # Conta US; para conta EU use https://otlp.eu01.nr-data.net
            - name: NEW_RELIC_OTLP_ENDPOINT
              value: "https://otlp.nr-data.net"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-collector-secret
                  key: NEW_RELIC_LICENSE_KEY
            - name: GOMEMLIMIT
              value: "200MiB"
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: services-ms
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
