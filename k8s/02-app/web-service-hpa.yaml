apiVersion: v1
kind: Service
metadata:
  name: services-ms-web
  namespace: services-ms
  labels:
    app: services-ms-web
spec:
  type: LoadBalancer
  selector:
    app: services-ms-web
  ports:
    - name: http
      # O security group do EKS libera 8080-8082; o monólito usa 8080.
      port: 8081
      targetPort: 8000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: services-ms-web-hpa
  namespace: services-ms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: services-ms-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
