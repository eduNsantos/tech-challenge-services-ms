sonar.projectKey=tech-challenge-services-ms
sonar.projectName=Tech Challenge - Services MS
sonar.projectVersion=1.0

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Cobertura em formato Clover gerada pelo PHPUnit (PCOV):
#   vendor/bin/phpunit --coverage-clover coverage.xml --log-junit junit.xml
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml

sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**
